spring.application.name=spring-boot-ai-sdlc-architecture-agent

# Chat model provider used for generation: openai or anthropic
spring.ai.model.chat=${AI_PROVIDER:openai}

# Only chat is used, so the other model auto-configurations stay off
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-haiku-4-5}
spring.ai.anthropic.chat.options.temperature=0.2
# An architecture model is larger than a list of user stories
spring.ai.anthropic.chat.options.max-tokens=8192

management.endpoints.web.exposure.include=health,info

server.error.include-message=always
server.error.include-binding-errors=always

architecture.max-requirement-characters=20000
architecture.max-context-characters=4000
architecture.max-stories=30
architecture.max-nfrs=30
architecture.max-containers=12
architecture.max-entities=15
architecture.max-flows=8
architecture.max-decisions=8
